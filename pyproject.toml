[project]
name = "pvccard"
version = "0.1.0"
description = "Turn downloaded Indian govt ID PDFs into print-ready PVC card images"
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pvccard = "pvccard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pvccard"]
